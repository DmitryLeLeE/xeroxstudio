name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests

  web:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.browser != 'chromium' }}   # Firefox / WebKit: informational until proven stable
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      ZINE_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt pytest playwright
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Generated web files are current
        run: |
          python tools/gen_config_js.py --check
          python tools/gen_sw.py --check
      - run: python -m pytest -q tests/web
