    <article><b>🎨</b><h3 data-ru="Ризо-палитры" data-en="Riso palettes"></h3><p data-ru="Девять готовых пар «бумага / краска» и свои цвета. Инверсия одним флажком." data-en="Nine ready paper / ink pairs plus your own colours. Invert with one switch."></p></article>
    <article><b>Aa</b><h3 data-ru="Манифесты и шрифты" data-en="Manifestos & type"></h3><p data-ru="Библиотека из 30 манифестов с поиском, свои тексты, три подложки (плашка, Dymo-лента, контур), перетаскивание подписи по листу." data-en="A library of 30 manifestos with search, your own texts, three backings (box, Dymo tape, outline) and a caption you can place anywhere."></p></article>
    <article><b>🖨</b><h3 data-ru="Готово к печати" data-en="Print-ready"></h3><p data-ru="PNG до 3×, PDF книги, PDF A4 с полями 10 мм, мини-зин на 8 страниц с линиями сгиба и разреза, 1-bit PNG для трафаретной печати." data-en="PNG up to 3×, book PDF, A4 PDF with 10 mm margins, 8-page mini-zine with fold and cut lines, 1-bit PNG for stencil printing."></p></article>
    <article><b>⇄</b><h3 data-ru="Проекты .zine" data-en=".zine projects"></h3><p data-ru="Файл проекта открывается и в браузере, и в программе для Windows. Автосохранение в браузере, отмена и возврат." data-en="One project file opens in the browser and in the Windows app. Autosave, undo and redo included."></p></article>

<section class="sec faq">
  <h2 data-ru="Вопросы" data-en="FAQ"></h2>
  <details><summary data-ru="Мои фото где-то хранятся?" data-en="Are my photos stored anywhere?"></summary><p data-ru="Нет. Всё считается в вашем браузере. Автосохранение лежит только в локальном хранилище вашего браузера. Ни аналитики, ни трекеров, ни серверной части нет." data-en="No. Everything is computed in your browser. Autosave lives only in your browser's local storage. There is no analytics, tracking or server component."></p></details>
  <details><summary data-ru="Работает ли без интернета?" data-en="Does it work offline?"></summary><p data-ru="Да, после первого открытия. Приложение можно установить на телефон или ПК («Добавить на главный экран» / «Установить»)." data-en="Yes, after the first visit. You can install it on a phone or computer (“Add to Home Screen” / “Install”)."></p></details>
  <details><summary data-ru="Какие браузеры поддерживаются?" data-en="Which browsers are supported?"></summary><p data-ru="Современные Chrome, Edge, Firefox и Safari (16.4+). Для больших экспортов (A4, 3×) на телефоне нужно достаточно памяти — если не хватило, снизьте масштаб." data-en="Current Chrome, Edge, Firefox and Safari (16.4+). Big exports (A4, 3×) on a phone need enough memory — lower the scale if it runs out."></p></details>
  <details><summary data-ru="Откуда пример-фото?" data-en="Where does the sample photo come from?"></summary><p data-ru="Портрет из архива NASA — общественное достояние." data-en="A NASA portrait — public domain."></p></details>

(function () {
  var L = localStorage.getItem("zine.lang") || ((navigator.language || "en").toLowerCase().indexOf("ru") === 0 ? "ru" : "en");
  function apply() {
    document.documentElement.lang = L;
    document.querySelectorAll("[data-ru]").forEach(function (e) { e.textContent = e.dataset[L]; });
    document.getElementById("lang").textContent = L === "ru" ? "EN" : "RU";
    document.title = L === "ru" ? "Xerox Zine Studio — ксерокс-зины из ваших фото" : "Xerox Zine Studio — make xerox zines from your photos";

  document.getElementById("lang").addEventListener("click", function () { L = L === "ru" ? "en" : "ru"; try { localStorage.setItem("zine.lang", L); } catch (e) {} apply(); });
  apply();
})();
