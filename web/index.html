<section id="manifesto" class="sec manifesto">
  <p class="kicker" data-ru="МАНИФЕСТ" data-en="MANIFESTO"></p>
  <blockquote>
    <p><mark data-ru="Искусство требует неидеальности, и в этом его сила." data-en="Art needs imperfection. That's where its strength is."></mark></p>
    <p data-ru="Я листал Instagram и смотрел на работы живых людей. Склеенные, перепечатанные, с поехавшей краской и пятнами тонера. Мне понравилось именно это. Захотелось делать так же у себя дома, без риза и без студии." data-en="I was scrolling Instagram, looking at work by real people. Glued together, re-printed, ink out of register, toner smudges. That's exactly what I liked. I wanted to make the same thing at home, with no riso and no studio."></p>
    <p data-ru="Поэтому тут нет кнопки «сделать красиво». Тут ползунки, которые всё портят: растр, шум, сдвиг, скотч, рваный край." data-en="So there is no “make it pretty” button. There are sliders that wreck things: halftone, noise, misregistration, tape, torn edges."></p>
    <p data-ru="Зин не продукт, а жест. Сложи лист, разрежь по красной линии, отдай кому-нибудь. Если вышло криво, значит, вышло." data-en="A zine isn't a product, it's a gesture. Fold the sheet, cut along the red line, give it to someone. If it came out crooked, it worked."></p>
  </blockquote>
</section>

<section id="features" class="sec">
  <h2 data-ru="Что умеет" data-en="What it does"></h2>
  <div class="grid">
    <article><b>◐</b><h3 data-ru="Растр" data-en="Halftone"></h3><p data-ru="Точки, линии, штриховка, стипль, Байер, мезотинт и ещё пара. Угол и размер задаёшь сам. Сверху шум тонера, полосы сканера и тень от края стекла копира." data-en="Dots, lines, cross-hatch, stipple, Bayer, mezzotint and a couple more. You set the angle and size. On top: toner noise, scanner streaks, the shadow at the edge of the copier glass."></p></article>
    <article><b>◑</b><h3 data-ru="Две краски" data-en="Two inks"></h3><p data-ru="Второй слой другого цвета и с другим углом растра. Он чуть съезжает, как на настоящем ризографе. Каждую краску можно выгрузить отдельным файлом и напечатать на реальной машине." data-en="A second colour on a different screen angle, slightly off, like on a real riso. You can export each ink as its own file and print it on a real machine."></p></article>
    <article><b>✂</b><h3 data-ru="Бумага и мусор" data-en="Paper and mess"></h3><p data-ru="Волокна бумаги, скотч, рваные края, сгиб посередине, дырки от дырокола, пятна кофе, пыль, штамп. 13 раскладок страницы. Каждая копия получается мутнее предыдущей." data-en="Paper fibres, tape, torn edges, a fold down the middle, punch holes, coffee stains, dust, a stamp. 13 page layouts. Every copy comes out a bit muddier than the last."></p></article>
    <article><b>Aa</b><h3 data-ru="Подписи" data-en="Captions"></h3><p data-ru="54 готовых манифеста, можно писать свои. Три подложки: плашка, лента Dymo, контур. Подпись можно перетащить в любое место." data-en="54 ready-made manifestos, or write your own. Three backings: box, Dymo tape, outline. Drag the caption anywhere."></p></article>
    <article><b>⎙</b><h3 data-ru="Печать" data-en="Printing"></h3><p data-ru="PNG, PDF книгой, PDF для A4 с полями, мини-зин на восемь страниц с линиями сгиба и разреза, схема сложения и 1-bit трафарет." data-en="PNG, book PDF, A4 PDF with margins, an 8-page mini-zine with fold and cut lines, a folding guide and a 1-bit stencil."></p></article>
    <article><b>⇄</b><h3 data-ru="Проекты" data-en="Projects"></h3><p data-ru="Файл .zine открывается и в браузере, и в программе для Windows. Автосохранение, отмена, возврат." data-en="A .zine file opens in the browser and in the Windows app. Autosave, undo, redo."></p></article>
  </div>
</section>

<section class="sec steps">
  <h2 data-ru="Как сделать зин" data-en="How to make a zine"></h2>
  <ol>    <li><b>1</b><span data-ru="Добавь фото. Если их несколько, каждое станет отдельной страницей." data-en="Add a photo. If you add several, each becomes its own page."></span></li>
    <li><b>2</b><span data-ru="Выбери пресет и крути ползунки. Или жми Remix и смотри, что выйдет." data-en="Pick a preset and move the sliders. Or hit Remix and see what happens."></span></li>
    <li><b>3</b><span data-ru="Экспортируй, распечатай, сложи, разрежь по красной линии." data-en="Export, print, fold, cut along the red line."></span></li>
  </ol>
  <a class="btn big" href="app/" data-ru="Попробовать сейчас →" data-en="Try it now →"></a>
</section>

<section id="desktop" class="sec desk">

    <h2 data-ru="Версия для Windows" data-en="Windows app"></h2>
    <p data-ru="То же самое, но обычной программой. На больших файлах быстрее, PDF без сжатия, браузер не нужен. Исходники открыты, собрать можно одной командой:" data-en="The same thing as a regular program. Faster on big files, uncompressed PDF, no browser needed. The source is open; build it with one command:"></p>
    <pre><code>git clone https://github.com/DmitryLeLeE/xeroxstudio
cd xeroxstudio
python build.py</code></pre>
    <p class="muted" data-ru="Получится dist/XeroxZineStudio.exe, нужен Python 3.11–3.13. Готовые exe, zip и установщик лежат в Releases." data-en="That gives you dist/XeroxZineStudio.exe and needs Python 3.11–3.13. Ready-made exe, zip and installer are in Releases."></p>

<section class="sec faq">
  <h2 data-ru="Вопросы" data-en="FAQ"></h2>
  <details><summary data-ru="Мои фото куда-то уходят?" data-en="Do my photos go anywhere?"></summary><p data-ru="Нет. Всё считается у тебя в браузере. Автосохранение лежит в его локальном хранилище. Ни аналитики, ни трекеров, ни сервера." data-en="No. It all runs in your browser. Autosave sits in its local storage. No analytics, no trackers, no server."></p></details>
  <details><summary data-ru="Работает без интернета?" data-en="Does it work offline?"></summary><p data-ru="Да, после первого открытия. Можно поставить как приложение на телефон или компьютер." data-en="Yes, after the first visit. You can install it as an app on a phone or a computer."></p></details>
  <details><summary data-ru="Какие браузеры?" data-en="Which browsers?"></summary><p data-ru="Свежие Chrome, Edge, Firefox и Safari (16.4+). Большой экспорт (A4, 3×) на телефоне может не влезть в память. Тогда поставь масштаб поменьше." data-en="Recent Chrome, Edge, Firefox and Safari (16.4+). A big export (A4, 3×) can run out of memory on a phone. Lower the scale then."></p></details>
  <details><summary data-ru="Откуда пример-фото?" data-en="Where does the sample photo come from?"></summary><p data-ru="Портрет из архива NASA, общественное достояние." data-en="A NASA portrait, public domain."></p></details>
