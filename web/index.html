<section id="manifesto" class="sec manifesto">
  <p class="kicker" data-ru="МАНИФЕСТ" data-en="MANIFESTO"></p>
  <blockquote>
    <p><mark data-ru="Искусство требует неидеальности — в этом его сила." data-en="Art needs imperfection. That is where its strength is."></mark></p>
    <p data-ru="Я листал Instagram и видел живые работы живых людей: склеенные, пережатые, напечатанные на чём попало, со сдвинутой краской и пятнами тонера. Они были настоящими. Я подумал: хочу делать так же, дома, без оборудования, без риза и без студии. Только фото, экран и принтер, какой есть." data-en="I was scrolling Instagram and saw real work by real people: glued together, over-compressed, printed on whatever was around, ink out of register, toner smudged. It felt alive. I thought: I want to make this at home, with no equipment, no riso machine, no studio. Just a photo, a screen and whatever printer I have."></p>
    <p data-ru="Поэтому здесь нет кнопки «сделать красиво». Есть ползунки, которые портят: растр, шум, сдвиг, скотч, рваный край. Гладкость можно купить. Характер приходится делать руками." data-en="So there is no “make it pretty” button. There are sliders that spoil things: halftone, noise, misregistration, tape, torn edges. Smoothness can be bought. Character has to be made by hand."></p>
    <p data-ru="Зин — это не продукт. Это жест. Сложи лист пополам, разрежь по красной линии и отдай другому. Если получилось чуть криво — значит, получилось." data-en="A zine is not a product. It is a gesture. Fold the sheet, cut along the red line, hand it to someone. If it came out a bit crooked, it worked."></p>
  </blockquote>
</section>

<section id="features" class="sec">
  <h2 data-ru="Что внутри" data-en="What's inside"></h2>
  <div class="grid">
    <article><b>◐</b><h3 data-ru="Честный растр" data-en="Real halftone"></h3><p data-ru="Амплитудный полутон с углом и размером точки, зерно Флойда–Стейнберга, жёсткий трафарет. Шум тонера, полосы сканера, тень края копира, сдвиг краски." data-en="Amplitude halftone with angle and dot size, Floyd–Steinberg grain, hard stencil. Toner noise, scanner streaks, copier edge shadow, ink misregistration."></p></article>
    <article><b>◑</b><h3 data-ru="Ризо-наложение" data-en="Riso overprint"></h3><p data-ru="Второй слой краски с другим углом растра, смещённый и перемноженный с первым. Девять пар «бумага / краска» и свои цвета." data-en="A second ink layer on a different screen angle, shifted and multiplied over the first. Nine paper / ink pairs plus your own colours."></p></article>
    <article><b>✂</b><h3 data-ru="Бумага, скотч, рваные края" data-en="Paper, tape, torn edges"></h3><p data-ru="Зерно и волокна бумаги, полоски скотча по углам, 13 раскладок (диагональ, стопка, мозаика, триптих…), каждая следующая копия мутнее. Вырезка-стикер и чёрная полоса на глазах (поиск лиц прямо в браузере)." data-en="Paper fibre and grain, strips of tape at the corners, 13 layouts (diagonal, pile, mosaic, triptych…), every next copy blurrier. Sticker cut-out and a black bar over the eyes (face detection runs right in the browser)."></p></article>
    <article><b>Aa</b><h3 data-ru="Манифесты и шрифты" data-en="Manifestos & type"></h3><p data-ru="Библиотека из 54 манифестов с поиском, свои тексты, три подложки (плашка, Dymo-лента, контур), перетаскивание подписи по листу." data-en="A library of 54 manifestos with search, your own texts, three backings (box, Dymo tape, outline) and a caption you can place anywhere."></p></article>
    <article><b>⎙</b><h3 data-ru="Готово к печати" data-en="Print-ready"></h3><p data-ru="PNG до 3×, PDF книги, PDF A4 с полями 10 мм, мини-зин на 8 страниц с линиями сгиба и разреза, 1-bit PNG для трафаретной печати." data-en="PNG up to 3×, book PDF, A4 PDF with 10 mm margins, 8-page mini-zine with fold and cut lines, 1-bit PNG for stencil printing."></p></article>
    <article><b>⇄</b><h3 data-ru="Проекты .zine" data-en=".zine projects"></h3><p data-ru="Файл проекта открывается и в браузере, и в программе для Windows. Автосохранение в браузере, отмена и возврат." data-en="One project file opens in the browser and in the Windows app. Autosave, undo and redo included."></p></article>
  </div>
</section>

    <li><b>3</b><span data-ru="Экспортируй, распечатай, сложи и разрежь по красной линии." data-en="Export, print, fold and cut along the red line."></span></li>

<section id="desktop" class="sec desk">

    <h2 data-ru="Версия для Windows" data-en="Windows app"></h2>
    <p data-ru="Та же студия как обычная программа: быстрее на больших файлах, PDF без сжатия, работает без браузера. Исходники открыты — собери одной командой:" data-en="The same studio as a native-style app: faster on huge files, lossless PDF, no browser needed. The source is open — build it with one command:"></p>
    <pre><code>git clone https://github.com/DmitryLeLeE/xeroxstudio
cd xeroxstudio
python build.py</code></pre>

<section class="sec faq">
  <h2 data-ru="Вопросы" data-en="FAQ"></h2>
  <details><summary data-ru="Мои фото где-то хранятся?" data-en="Are my photos stored anywhere?"></summary><p data-ru="Нет. Всё считается в вашем браузере. Автосохранение лежит только в локальном хранилище браузера. Ни аналитики, ни трекеров, ни серверной части нет." data-en="No. Everything is computed in your browser. Autosave lives only in your browser's local storage. There is no analytics, tracking or server component."></p></details>
  <details><summary data-ru="Работает ли без интернета?" data-en="Does it work offline?"></summary><p data-ru="Да, после первого открытия. Приложение можно установить на телефон или ПК («Добавить на главный экран» / «Установить»)." data-en="Yes, after the first visit. You can install it on a phone or computer (“Add to Home Screen” / “Install”)."></p></details>
  <details><summary data-ru="Какие браузеры поддерживаются?" data-en="Which browsers are supported?"></summary><p data-ru="Современные Chrome, Edge, Firefox и Safari (16.4+). Для больших экспортов (A4, 3×) на телефоне нужно достаточно памяти — если не хватило, снизьте масштаб." data-en="Current Chrome, Edge, Firefox and Safari (16.4+). Big exports (A4, 3×) on a phone need enough memory — lower the scale if it runs out."></p></details>
  <details><summary data-ru="Откуда пример-фото?" data-en="Where does the sample photo come from?"></summary><p data-ru="Портрет из архива NASA — общественное достояние." data-en="A NASA portrait — public domain."></p></details>
</section>
